name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 13 * * *'      # daily, picks up PROJECT.md changes in project repos
  workflow_dispatch: {}         # "Run workflow" button
  repository_dispatch:
    types: [project-updated]    # optional: a project repo can ping this after a push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull PROJECT.md from project repos
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
